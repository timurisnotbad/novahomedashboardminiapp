<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Nova Home CRM</title>
<style>body{font:14px -apple-system,Segoe UI,sans-serif;width:320px;padding:14px;color:#1C1C1E}label{display:block;font-size:12px;color:#666;margin:8px 0 3px}input{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #ccc;border-radius:8px}button{margin-top:10px;padding:8px 12px;border:none;border-radius:8px;background:#2563EB;color:#fff;font-weight:600;cursor:pointer}button.sec{background:#eee;color:#222}.st{font-size:12px;color:#666;margin-top:8px;white-space:pre-wrap}</style></head>
<body><b>Nova Home CRM · Booking.com</b>
<label>Адрес CRM</label><input id="crm" placeholder="https://app.novahomedashboard.com">
<label>Ключ расширения (CRM → Каналы → Booking.com)</label><input id="token" placeholder="32 символа">
<button id="save">Сохранить</button> <button id="now" class="sec">Проверить сейчас</button> <button id="snap" class="sec">Снимок страницы</button>
<div class="st" id="st"></div>
<script src="popup.js"></script></body></html>
