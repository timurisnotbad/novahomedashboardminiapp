<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nova Home</title>
  <link rel="stylesheet" href="css/style.css?v=34" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="staff-mode"><!-- start locked down; app.js unlocks owner after /api/me -->
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 9.5V20h4v-5h4v5h4V9.5"/></g></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.6"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></g></symbol>
    <symbol id="i-clean" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l1.5 5.2 5.2 1.5-5.2 1.5L12 17l-1.5-5.2L5.3 10.3l5.2-1.5z"/><path d="M18.2 15.4l.6 1.9 1.9.6-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6z"/></g></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.1"/><path d="M3.6 19.4c.5-3.1 2.7-4.8 5.4-4.8s4.9 1.7 5.4 4.8"/><path d="M15.6 6.3a3.1 3.1 0 0 1 0 5.9M17.2 14.9c1.9.5 3 1.9 3.3 4.5"/></g></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5h16"/><path d="M6 20V12M11 20V5.5M16 20v-6"/></g></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6.5" width="17" height="12" rx="2.6"/><path d="M14 12.5h6.5"/><circle cx="16.4" cy="12.5" r="1.05" fill="currentColor" stroke="none"/></g></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7h10M9.5 12h10M9.5 17h10"/><path d="M4 6.6l1 1 1.7-2.1M4 11.6l1 1 1.7-2.1M4 16.6l1 1 1.7-2.1"/></g></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18.4 9A6.8 6.8 0 0 0 6.3 7.1"/><path d="M6 4v3.4h3.4"/><path d="M5.6 15A6.8 6.8 0 0 0 17.7 16.9"/><path d="M18 20v-3.4h-3.4"/></g></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.4"/><path d="M10.4 10.4 20 20M16.8 16.8l2-2M14 14l2-2"/></g></symbol>
    <symbol id="i-door" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4H6v16h8"/><path d="M10 12h9M16.2 8.5 19.7 12l-3.5 3.5"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.4 4.4L19 7.3"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 4.5 4.5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5z"/></g></symbol>
    <symbol id="i-wallet2" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l1.5 3 3-9 2 6 1.5-2H21"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.6V12l3 1.8"/></g></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 12s3.4-6 9.2-6 9.2 6 9.2 6-3.4 6-9.2 6-9.2-6-9.2-6z"/><circle cx="12" cy="12" r="2.8"/></g></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h7l8.5 8.5-6.5 6.5L4 11.5z"/><circle cx="8" cy="8.5" r="1.3" fill="currentColor" stroke="none"/></g></symbol>
  </svg>

  <div id="ptr" class="ptr"><div class="ptr-spinner"></div></div>

  <!-- HEADER -->
  <header class="app-header">
    <div class="app-header__title">
      <h2 id="header-title">Сегодня</h2>
      <div id="header-date" class="app-header__date">—</div>
    </div>
    <button id="sync-btn" class="round" aria-label="Обновить"><svg><use href="#i-sync"/></svg></button>
  </header>

  <!-- SCREENS -->
  <main id="app" class="app-main">
    <section id="screen-today" class="screen"></section>
    <section id="screen-tomorrow" class="screen hidden"></section>
    <section id="screen-cleaning" class="screen hidden"></section>
    <section id="screen-guests" class="screen hidden owner-only"></section>
    <section id="screen-week" class="screen hidden"></section>
    <section id="screen-finance" class="screen hidden owner-only"></section>
    <section id="screen-prices" class="screen hidden owner-only"></section>
    <section id="screen-tasks" class="screen hidden"></section>
    <section id="screen-payments" class="screen hidden"></section>
    <section id="screen-control" class="screen hidden owner-only"></section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item is-active" data-screen="today"><svg><use href="#i-home"/></svg><span>Сегодня</span></button>
    <button class="nav-item" data-screen="tomorrow"><svg><use href="#i-cal"/></svg><span>Завтра</span></button>
    <button class="nav-item" data-screen="cleaning"><svg><use href="#i-clean"/></svg><span>Уборки</span></button>
    <button class="nav-item owner-only" data-screen="guests"><svg><use href="#i-users"/></svg><span>Гости</span></button>
    <button class="nav-item" data-screen="week"><svg><use href="#i-chart"/></svg><span>Неделя</span></button>
    <button class="nav-item owner-only" data-screen="finance"><svg><use href="#i-wallet"/></svg><span>Касса</span></button>
    <button class="nav-item owner-only" data-screen="prices"><svg><use href="#i-tag"/></svg><span>Цены</span></button>
    <button class="nav-item pay-only" data-screen="payments"><svg><use href="#i-wallet2"/></svg><span>Оплаты</span></button>
    <!-- owners find Задачи inside Контроль; staff keep the tab -->
    <button class="nav-item staff-only" data-screen="tasks"><svg><use href="#i-tasks"/></svg><span>Задачи</span></button>
    <button class="nav-item owner-only" data-screen="control"><svg><use href="#i-eye"/></svg><span>Контроль</span></button>
  </nav>

  <!-- GUEST DETAIL SHEET -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet__backdrop"></div>
    <div class="sheet__card" id="sheet-content"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/api.js?v=34"></script>
  <script src="js/components/ui.js?v=34"></script>
  <script src="js/components/booking-card.js?v=34"></script>
  <script src="js/components/cleaning-card.js?v=34"></script>
  <script src="js/components/metrics.js?v=34"></script>
  <script src="js/components/picker.js?v=34"></script>
  <script src="js/screens/today.js?v=34"></script>
  <script src="js/screens/tomorrow.js?v=34"></script>
  <script src="js/screens/cleaning.js?v=34"></script>
  <script src="js/screens/guests.js?v=34"></script>
  <script src="js/screens/occupancy.js?v=34"></script>
  <script src="js/screens/finance.js?v=34"></script>
  <script src="js/screens/prices.js?v=34"></script>
  <script src="js/screens/payrecon.js?v=34"></script>
  <script src="js/screens/tasks.js?v=34"></script>
  <script src="js/screens/control.js?v=34"></script>
  <script src="js/app.js?v=34"></script>
</body>
</html>
