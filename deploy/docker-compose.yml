# Nova Home on a Linux server: app + Caddy (automatic HTTPS for CRM_DOMAIN).
# Usage: see deploy/install_server.sh (one command does everything).
services:
  nova:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      - WA_BRIDGE=${WA_BRIDGE:-1}
    volumes:
      - nova-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CRM_DOMAIN=${CRM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nova-data:
  caddy-data:
  caddy-config:
